# Local dev/test Postgres. `pnpm db:up` starts it; data lives in the named volume.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: steward
      POSTGRES_DB: steward
    ports:
      - '54329:5432'
    volumes:
      - steward-pg:/var/lib/postgresql/data
      - ./scripts/sql/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U steward -d steward']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  steward-pg:
