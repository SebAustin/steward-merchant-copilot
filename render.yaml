# Steward on Render (PLAN section 11, SC-18). Never deploy without the project owner's go-ahead.
#
# One web service + one Postgres + one env group. Secrets are `sync: false`: Render asks for them
# in the dashboard on the first Blueprint sync and never stores them in this repo.
#
# Plans (D-10): web is `free` until v0.5, then change to `starter` (a free web service sleeps
# after 15 minutes). Postgres is paid `basic-256mb` from the start (free Postgres expires in 30 days).

databases:
  - name: steward-db
    plan: basic-256mb
    postgresMajorVersion: '17'
    # Explicit so the disk never autoscales into a bigger bill than D-10 approved.
    diskSizeGB: 1
    databaseName: steward
    user: steward
    region: oregon

services:
  - type: web
    name: steward
    runtime: node
    plan: free
    region: oregon
    # devDependencies are needed to build (TypeScript, types), so install them explicitly.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    # Applies pending migrations, then `next start` on $PORT.
    startCommand: bash scripts/start.sh
    healthCheckPath: /api/health
    # Deploy only after CI checks pass on the branch.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: steward-db
          property: connectionString
      # The mock model is rejected on Render (lib/env), so a credential-free deploy still names
      # the real provider. Without a key the health check reports the model as skipped.
      - key: AI_PROVIDER
        value: anthropic
      - key: DISPUTE_SOURCE
        value: simulated
      - key: TRUSTED_PROXY_HOPS
        value: '1'
      - fromGroup: steward-secrets

envVarGroups:
  - name: steward-secrets
    envVars:
      # Generated by Render once; signs the session cookie. Rotating it signs everyone out.
      - key: SESSION_SECRET
        generateValue: true
      # The shared passcode printed in the README (D-4). Owner chooses it.
      - key: DEMO_PASSCODE
        sync: false
      # Must equal the CRON_SECRET Actions secret (from slice 0.2b).
      - key: CRON_SECRET
        sync: false
      # Sandbox PayPal app (from slice 0.1c); leave blank until then.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Set after registering the webhook for the Render URL (slice 0.5a).
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Public, domain-locked AG Grid license key (decision date Oct 20).
      - key: NEXT_PUBLIC_AG_GRID_LICENSE_KEY
        sync: false
